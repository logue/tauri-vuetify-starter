[package]
name = "tauri-vue3-app"
version = "0.0.0"
authors = ["Your Name <your@email.com>"]
edition = "2024"
rust-version = "1.99.1"
description = "A modern desktop application built with Tauri v2 and Vue 3"
readme = "../ReadMe.md"
repository = "https://github.com/yourname/your-app-name"
homepage = "https://yourdomain.com/your-app-name"
license-file = "../LICENSE"
keywords = ["application", "desktop", "tauri", "vue"]
categories = ["gui"]

[lib]
name = "tauri_vue3_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
jiff = { version = "0.2", features = ["serde"] }

tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
opt-level = 3
windows = { version = "^0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

# macOS 固有の最適化
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27"
core-foundation = "0.10"
core-graphics = "0.25"
objc = "0.2"

# Apple Silicon (ARM64) 向けの設定
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "target-cpu=apple-a14"] # Apple Silicon互換性向上
